# Test profile, activated with @ActiveProfiles("test") on the Spring-based test classes.
# It is layered on top of src/main/resources/application.properties, so the shared session settings still apply.

# In-memory H2: tests need no PostgreSQL server and none of the DB_* environment variables
spring.datasource.url=jdbc:h2:mem:japtrack_test
spring.datasource.username=sa
spring.datasource.password=

# The Flyway migrations are written for PostgreSQL, so tests build the schema from the entities instead
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
