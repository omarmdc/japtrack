# =====================
# APP
# =====================
spring.application.name=Japtrack


# =====================
# DATABASE (PostgreSQL)
# =====================
# Connection details come only from environment variables, so no credentials are ever committed.
# There are deliberately no defaults: if a variable is missing, the application fails at startup
# instead of quietly connecting somewhere unexpected.
# DB_URL must be in JDBC form, e.g. jdbc:postgresql://localhost:5432/japtrack
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# =====================
# JPA / HIBERNATE
# =====================
# Flyway migrations (src/main/resources/db/migration) own the schema. "validate" means Hibernate never
# creates or alters tables; it only checks at startup that the entities match the migrated schema
# and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# =====================
# SERVER
# =====================
server.port=8080


# =====================
# SESSION COOKIE
# =====================
# Secure=true is set in application-prod.properties (HTTPS only), so local HTTP development still works
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
